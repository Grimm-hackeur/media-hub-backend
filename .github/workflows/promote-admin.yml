name: Promote Media Hub Admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: "xenizzxenn@gmail.com"
        required: true
        type: string

jobs:
  promote-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev

      - name: Promote account to admin
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_EMAIL: ${{ inputs.email }}
        run: npm run admin:promote -w apps/api -- "$ADMIN_EMAIL"
